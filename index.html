<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Entrar | Mapa Estratégico 2027</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main id="login" class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <img src="./logo.png" alt="Cereal Ouro" class="logo">
      <small>SISTEMA DE GESTÃO INTEGRADO</small>
      <h1 id="login-title">Mapa Estratégico 2027</h1>
      <p>Acesso reservado aos gestores autorizados. Informe seu e-mail para receber um link de entrada.</p>
      <form id="login-form">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Enviar link de acesso</button>
      </form>
      <p id="login-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <section id="workspace" hidden>
    <header class="bar">
      <div class="brand"><img src="./logo.png" alt=""><span>Mapa Estratégico 2027</span></div>
      <div id="presence" class="presence" aria-live="polite"></div>
      <div class="bar-actions"><span id="identity"></span><button id="manage-access" hidden>Gerenciar acessos</button><button id="sign-out">Sair</button></div>
    </header>
    <div id="app-status" class="app-status" aria-live="polite"></div>
    <iframe id="presentation" title="Apresentação interativa do Mapa Estratégico 2027"></iframe>
    <aside id="activity" class="activity" aria-label="Atividade recente"></aside>
  </section>
  <dialog id="access-dialog" aria-labelledby="access-title">
    <div class="dialog-head"><h2 id="access-title">Gerenciar acessos</h2><button id="close-access" aria-label="Fechar">Fechar</button></div>
    <p>Rogério e Diego podem alterar o acesso dos demais gestores. Toda mudança é registrada.</p>
    <div id="access-list"></div>
    <h3>Alterações recentes</h3>
    <div id="access-audit"></div>
  </dialog>
</body>
</html>
